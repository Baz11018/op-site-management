<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OP Site Management</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#0d1830;--muted:#78849a;--line:#e9edf5;--blue:#2878ff;--purple:#7555ff;--red:#ef4d57;--orange:#ff9418;--green:#18a65b;--shadow:0 10px 30px rgba(34,52,84,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:650px;margin:auto;padding:18px 16px 30px}
.top{display:flex;align-items:center;gap:12px;margin:8px 0 22px}.brand{font-size:29px;font-weight:800;letter-spacing:-.9px}.sub{font-size:14px;color:var(--muted);margin-top:3px}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:750;color:var(--blue);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:13px}.project{cursor:pointer}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:800}.small{font-size:13px;color:var(--muted);line-height:1.45}
.section{font-size:12px;font-weight:800;letter-spacing:.8px;color:#758096;margin:22px 5px 10px}.counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip,.pill{font-size:12px;font-weight:800;border-radius:999px;padding:7px 10px;background:#eef2f8}.red{color:#c52e37;background:#fff0f1}.orange{color:#b95d00;background:#fff2e2}.blue{color:#1762d4;background:#eaf3ff}.green{color:#087e42;background:#e7f8ef}
.btn{border:0;border-radius:17px;padding:15px 16px;font-weight:800;min-height:52px}.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}.secondary{background:#edf2fa;color:var(--text)}.danger{background:#fff0f1;color:var(--red)}.success{background:#e5f8ed;color:#078341}.orangeBtn{background:#fff0df;color:#bd6200}.blueBtn{background:#e8f2ff;color:#1767d8}.block{width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.hero{background:#fff}.hero h1{margin:0;font-size:27px}.projectOverview{display:flex;gap:9px;margin-top:14px}.overviewBtn{flex:1;border:0;background:#f3f6fb;border-radius:15px;padding:10px 12px;text-align:left;color:var(--text)}.overviewBtn b{font-size:18px}.overviewBtn span{font-size:11px;font-weight:800;color:var(--muted);margin-left:5px}.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.metric{border-radius:18px;padding:15px}.metric b{display:block;font-size:24px}.metric span{font-size:11px;font-weight:800}.metric.red{background:#fff0f1}.metric.orange{background:#fff2e2}.metric.blue{background:#eaf3ff}.metric.green{background:#e7f8ef}
.item{padding:16px 17px;cursor:pointer}.itemrow{display:flex;gap:13px;align-items:center}.statusIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:0 0 42px}.statusIcon.red{background:#fff0f1}.statusIcon.orange{background:#fff2e2}.statusIcon.blue{background:#eaf3ff}.statusIcon.green{background:#e7f8ef}.statusIcon.fuchsia{background:#fde7f5;color:#b42378}
.meta{margin-top:5px;font-size:12px;color:var(--muted)}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;color:#778298;margin:0 0 6px 4px;letter-spacing:.5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px;color:var(--text);outline:none;font-size:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#f3f6fb;border-radius:18px;padding:15px;margin:8px 0 16px}.toggle input{width:25px;height:25px}
.segment{display:grid;grid-template-columns:1fr 1fr;background:#edf1f7;border-radius:14px;padding:3px;margin-bottom:16px}.segment button{border:0;border-radius:11px;padding:10px;font-weight:800;background:transparent;color:#68758c}.segment button.on{background:var(--blue);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;font-size:10px;font-weight:700;color:#8993a5;padding:6px 2px}.nav button.active{color:var(--blue)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:31px;box-shadow:0 10px 25px rgba(55,102,255,.28);z-index:11}
.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#e9edf5;font-weight:750;font-size:12px}.tabs button.on{background:var(--text);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 10px}.version{text-align:center;color:#a0a8b7;font-size:11px;margin-top:18px}
.statusPanel{border-radius:20px;padding:15px 16px;margin-top:18px}.statusPanel.orange{background:#fff1df}.statusPanel.green{background:#e6f8ee}.statusPanel.blue{background:#e9f3ff}.statusBig{font-size:14px;font-weight:850}.statusSub{font-size:12px;margin-top:4px;opacity:.75}
.actionStack{display:grid;gap:10px;margin-top:12px}.actionBtn{width:100%;border:0;border-radius:18px;padding:17px 14px;font-weight:850;font-size:15px}.actionBtn.blue{background:#e8f2ff;color:#1266dc}.actionBtn.orange{background:#fff0df;color:#bd6200}.actionBtn.green{background:#e4f8ec;color:#078642}.actionBtn.gray{background:#eef2f8;color:#263247}
.materialGroups .card{padding:0;overflow:hidden}.materialRow{display:flex;align-items:center;gap:12px;padding:17px;border-bottom:1px solid var(--line)}.materialRow:last-child{border-bottom:0}.materialRow .count{margin-left:auto;font-weight:800}.materialRow .arrow{color:#a1a9b7}
.historyToggle{border:0;background:none;color:var(--blue);font-weight:750;padding:10px 2px}.timeline{border-left:2px solid #e5e9f1;margin:8px 0 0 8px;padding-left:15px}.event{margin-bottom:12px}
.hidden{display:none!important}
@media print{body{background:#fff;padding:0}.nav,.fab,.no-print,.back{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ddd}.report-title{display:block!important}}.report-title{display:none}
.photoThumb{width:52px;height:52px;border-radius:13px;object-fit:cover}.photoPick{display:flex;align-items:center;gap:12px;background:#f3f6fb;border-radius:18px;padding:12px;margin:10px 0 14px}.photoOverlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:grid;place-items:center;padding:18px}.photoOverlay img{max-width:100%;max-height:90vh;border-radius:18px}.metric{border:0;text-align:left;color:inherit}.materialRow{cursor:pointer}.stepList{display:grid;gap:9px;margin-top:15px}.stepBtn{width:100%;border:0;border-radius:17px;padding:15px;text-align:left;font-weight:850;background:#eef2f8;color:#6e788b}.stepBtn.done{background:#e5f8ed;color:#087f43}.stepBtn.current{background:#e9f3ff;color:#1766d6;box-shadow:inset 0 0 0 2px #2780ff}.areaRow{display:flex;align-items:center;padding:17px;border-bottom:1px solid var(--line);cursor:pointer}.areaRow b{flex:1}.tinyDanger{display:block;border:0;background:none;color:#d94b55;font-size:13px;font-weight:750;margin:22px auto}.filterTitle{font-size:25px;font-weight:850}
.stickyHead{position:sticky;top:0;z-index:20;background:rgba(246,248,252,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:env(safe-area-inset-top);margin:calc(-1 * env(safe-area-inset-top)) -16px 16px;padding-left:16px;padding-right:16px;border-bottom:1px solid rgba(220,225,234,.7)}
.materialCard .title{font-size:20px}.reminderSheet{position:fixed;inset:0;background:rgba(10,18,32,.35);z-index:100;display:flex;align-items:flex-end}.sheetBox{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(20,30,50,.18)}.dayPicker{width:100%;font-size:22px;font-weight:800;padding:14px;border-radius:16px;border:1px solid var(--line);background:#f3f6fb}.reportSettings{margin-top:28px;opacity:.92}.fileButton{position:relative;overflow:hidden}.fileButton input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}.pdfActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.stickyHead .top{margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

var APP="OP Site Management";
var VERSION="1.4.2";
var KEY="op-site-management-v1-data";
var state={projects:[],reportTemplateName:"",reportTemplateData:""};
var view={smartFilter:null,areaFilter:null,areaKeys:[],tempPhoto:'',draft:null,screen:"projects",projectId:"",tab:"today",filter:"all",itemId:"",pdfBlob:null,pdfUrl:"",pdfName:""};

function q(id){return document.getElementById(id)}
function esc(s){s=String(s==null?"":s);return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).substr(2,7)}
function isoToday(){var d=new Date();var y=d.getFullYear();var m=("0"+(d.getMonth()+1)).slice(-2);var day=("0"+d.getDate()).slice(-2);return y+"-"+m+"-"+day}
function stamp(){return new Date().toISOString()}
function fmt(d){if(!d)return "—";var x=new Date(d+"T12:00:00");return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert("Could not save data on this device.");return false}}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var x=JSON.parse(raw);if(x&&x.projects instanceof Array)state=x}}catch(e){state={projects:[]}}}

function project(){var i;for(i=0;i<state.projects.length;i++){if(state.projects[i].id===view.projectId)return state.projects[i]}return null}
function currentItem(){var p=project(),i;if(!p)return null;for(i=0;i<p.items.length;i++){if(p.items[i].id===view.itemId)return p.items[i]}return null}
function isDone(i){return i.status==="done"}
function daysLate(d){if(!d)return 0;var a=new Date(isoToday()+"T12:00:00");var b=new Date(d+"T12:00:00");return Math.floor((a-b)/86400000)}
function reminderDue(i){if(isDone(i)||!i.reminderAt||i.materialStatus!=="ordered")return false;return daysLate(i.reminderAt)>=0}
function overdueDays(i){if(!reminderDue(i))return 0;return Math.max(0,daysLate(i.reminderAt))}
function isOverdue(i){return false}
function isReady(i){return !isDone(i)&&i.requiresMaterial&&(i.materialStatus==="received"||i.materialStatus==="installed")}
function bucket(i){if(reminderDue(i))return "follow";if(i.requiresMaterial&&i.materialStatus==="ordered")return "waiting";return "do"}
function counts(p){var r={open:0,done:0,over:0,follow:0,ready:0},i,x;for(i=0;i<p.items.length;i++){x=p.items[i];if(isDone(x))r.done++;else r.open++;if(reminderDue(x))r.follow++;if(isReady(x))r.ready++}return r}

function top(title,sub,back){
 return '<div class="top">'+(back?'<button class="back" onclick="App.back()">‹</button>':'')+
 '<div><div class="brand">'+esc(title)+'</div><div class="sub">'+esc(sub||"")+'</div></div></div>'
}
function nav(){
 var tabs=[["today","☀️","Today"],["items","✓","Tasks"],["issues","⚠️","Issues"],["materials","▦","Materials"],["report","▤","Report"]],h='<div class="nav">',i,t;
 for(i=0;i<tabs.length;i++){t=tabs[i];h+='<button class="'+(view.tab===t[0]?"active":"")+'" onclick="App.tab(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>'}
 return h+"</div>"
}
function itemCard(i){
 var late=overdueDays(i),m=i.requiresMaterial?(i.materialStatus||"requested"):"none",cl="blue",ico="✓",label="";
 if(isDone(i)){cl="green";ico="✓";label="Done"}
 else if(m==="received"){cl="fuchsia";ico="🚚";label="Received · Ready to install"}
 else if(m==="ordered"){cl="orange";ico="⏱";label="Ordered "+ageText(i.orderedAt)}
 else if(m==="requested"){cl="orange";ico="📦";label="Material to order"}
 else if(late>0){cl="red";ico="!";label="Overdue"}
 else {cl="blue";ico="✓";label="Open"}
 return '<div class="card item" onclick="App.openItem(\''+i.id+'\')"><div class="itemrow"><div class="statusIcon '+cl+'">'+ico+'</div><div style="min-width:0;flex:1"><div class="title">'+esc(i.title)+'</div><div class="small">'+esc(i.area||"General")+(i.responsible?' · '+esc(i.responsible):'')+'</div><div class="meta">'+label+'</div></div><span style="color:#a2abba">›</span></div></div>'
}
function projectsView(){
 var h='<div class="wrap">'+top(APP,"Simple site control",false)+'<div class="section">PROJECTS</div>',i,p,c;
 if(!state.projects.length)h+='<div class="card empty">No projects yet.<br>Create your first site project.</div>';
 for(i=0;i<state.projects.length;i++){p=state.projects[i];c=counts(p);h+='<div class="card project" onclick="App.openProject(\''+p.id+'\')"><div class="between"><div class="title">'+esc(p.name)+'</div><span>›</span></div><div class="counts">'+
 (c.over?'<span class="chip red">🔴 '+c.over+' urgent</span>':'')+
 (c.follow?'<span class="chip orange">🟠 '+c.follow+' follow-up</span>':'')+
 '<span class="chip blue">🔵 '+c.open+' open</span>'+
 (c.done?'<span class="chip green">✓ '+c.done+' done</span>':'')+'</div></div>'}
 h+='<button class="btn primary block" onclick="App.newProject()">+ New Project</button>'+
 '<div class="actions"><button class="btn secondary" onclick="App.importClick()">Restore Project Backup</button></div>'+
 '<input id="restoreFile" class="hidden" type="file" accept="application/json,.json" onchange="App.restoreBackup(this.files[0])">'+
 '<div class="version">'+APP+' v'+VERSION+'</div></div>';
 return h
}
function todayView(){var p=project(),c=counts(p),ot=0,oi=0,ti,z;for(ti=0;ti<p.items.length;ti++){z=p.items[ti];if(!isDone(z)){if(z.kind==="issue")oi++;else ot++}}var x='<div class="card hero"><h1>Today</h1><div class="small">'+new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+'</div><div class="projectOverview"><button class="overviewBtn" onclick="App.tab(\'items\')"><b>'+ot+'</b><span>TASKS</span></button><button class="overviewBtn" onclick="App.tab(\'issues\')"><b>'+oi+'</b><span>ISSUES</span></button></div><div class="grid4"><button class="metric red" onclick="App.smart(\'overdue\')"><b>'+c.over+'</b><span>OVERDUE</span></button><button class="metric orange" onclick="App.smart(\'follow\')"><b>'+c.follow+'</b><span>FOLLOW UP</span></button><button class="metric blue" onclick="App.smart(\'waiting\')"><b>'+countWaiting(p)+'</b><span>WAITING MATERIAL</span></button><button class="metric green" onclick="App.smart(\'ready\')"><b>'+c.ready+'</b><span>READY TO INSTALL</span></button></div></div>',a=[],i,z;for(i=0;i<p.items.length;i++){z=p.items[i];if(!isDone(z)&&(reminderDue(z)||isReady(z)))a.push(z)}if(a.length){x+='<div class="section">NEEDS ATTENTION</div>';for(i=0;i<a.length;i++)x+=itemCard(a[i])}else x+='<div class="card empty">Everything is under control. ✓</div>';return x}
function countWaiting(p){var n=0,i;for(i=0;i<p.items.length;i++)if(!isDone(p.items[i])&&p.items[i].requiresMaterial&&p.items[i].materialStatus==="ordered")n++;return n}
function countAction(p,a){var n=0,i;for(i=0;i<p.items.length;i++){if(!isDone(p.items[i])&&bucket(p.items[i])===a)n++}return n}
function listView(mode){var p=project(),a=[],i,z,x="";if(mode==="materials"){var r=0,o=0,c=0;for(i=0;i<p.items.length;i++){z=p.items[i];if(isDone(z)||!z.requiresMaterial)continue;if(z.materialStatus==="requested")r++;if(z.materialStatus==="ordered")o++;if(z.materialStatus==="received")c++}return '<div class="section">MATERIALS</div><div class="materialGroups card">'+matRow("📦","Requested",r,"orange","requested")+matRow("🛒","Ordered",o,"blue","ordered")+matRow("🚚","Received",c,"fuchsia","received")+matRow("🔧","Ready to install",c,"green","ready")+'</div>'}for(i=0;i<p.items.length;i++){z=p.items[i];if(mode==="issues"&&z.kind!=="issue")continue;if(mode==="items"&&z.kind==="issue")continue;if(view.filter==="open"&&isDone(z))continue;if(view.filter==="done"&&!isDone(z))continue;a.push(z)}a.sort(function(a,b){return (isDone(a)?1:0)-(isDone(b)?1:0)});x='<div class="section">'+(mode==="issues"?"ISSUES":"TASKS")+' · '+a.length+'</div>';if(!a.length)return x+'<div class="card empty">Nothing here.</div>';for(i=0;i<a.length;i++)x+=itemCard(a[i]);return x}
function matRow(ic,l,n,cl,k){return '<div class="materialRow" onclick="App.smart(\''+k+'\')"><div class="statusIcon '+cl+'">'+ic+'</div><b>'+l+'</b><span class="count">'+n+'</span><span class="arrow">›</span></div>'}
function materialCard(i){var at=i.orderedAt||i.requestedAt||"",status=i.materialStatus==="ordered"?"Ordered "+ageText(at):i.materialStatus==="requested"?"Requested "+ageText(at):i.materialStatus==="received"?"Received "+ageText(i.receivedAt):i.materialStatus==="installed"?"Installed "+ageText(i.installedAt):"";return '<div class="card item materialCard" onclick="App.openItem(\''+i.id+'\')"><div class="itemrow"><div class="statusIcon '+(i.materialStatus==="received"?"fuchsia":i.materialStatus==="installed"?"green":"orange")+'">📦</div><div style="min-width:0;flex:1"><div class="title">'+esc(i.materialName||"Unnamed material")+'</div><div class="small">'+esc(i.title)+' · '+esc(i.area||"General")+'</div><div class="meta">'+status+'</div></div><span style="color:#a2abba">›</span></div></div>'}
function smartView(){var p=project(),k=view.smartFilter,a=[],i,z,t={overdue:"Overdue",follow:"Follow up",waiting:"Waiting material",ready:"Ready to install",requested:"Requested materials",ordered:"Ordered materials",received:"Received materials"}[k]||"Items";for(i=0;i<p.items.length;i++){z=p.items[i];if(isDone(z))continue;if(k==="overdue"&&isOverdue(z))a.push(z);if(k==="follow"&&reminderDue(z))a.push(z);if((k==="waiting"||k==="ordered")&&z.requiresMaterial&&z.materialStatus==="ordered")a.push(z);if(k==="ready"&&isReady(z))a.push(z);if(k==="received"&&z.requiresMaterial&&z.materialStatus==="received")a.push(z);if(k==="requested"&&z.requiresMaterial&&z.materialStatus==="requested")a.push(z)}var x='<div class="filterTitle">'+t+'</div><div class="small">'+a.length+' items</div><div class="section">'+(k==="requested"||k==="ordered"||k==="received"||k==="waiting"||k==="ready"?"MATERIALS":"ITEMS")+'</div>';for(i=0;i<a.length;i++)x+=(k==="requested"||k==="ordered"||k==="received"||k==="waiting"||k==="ready"?materialCard(a[i]):itemCard(a[i]));return x}
function areasView(){var p=project(),m={},i,a,z,k,x='<div class="section">AREAS</div><div class="card">';for(i=0;i<p.items.length;i++){z=p.items[i];if(isDone(z))continue;a=(z.area||"General").trim()||"General";m[a]=(m[a]||0)+1}k=Object.keys(m).sort();view.areaKeys=k;for(i=0;i<k.length;i++)x+='<div class="areaRow" onclick="App.areaByIndex('+i+')"><b>⌖ &nbsp;'+esc(k[i])+'</b><span>'+m[k[i]]+' &nbsp;›</span></div>';return x+'</div>'}
function areaItemsView(){var p=project(),a=[],i,z;for(i=0;i<p.items.length;i++){z=p.items[i];if(!isDone(z)&&(z.area||"General")===view.areaFilter)a.push(z)}var x='<div class="filterTitle">'+esc(view.areaFilter)+'</div><div class="small">'+a.length+' open Task / Issue</div><div class="section">WHAT IS MISSING HERE?</div>';for(i=0;i<a.length;i++)x+=itemCard(a[i]);return x}
