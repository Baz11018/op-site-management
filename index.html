<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OP Site Management">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OP Site Management</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#0d1830;--muted:#78849a;--line:#e9edf5;--blue:#2878ff;--purple:#7555ff;--red:#ef4d57;--orange:#ff9418;--green:#18a65b;--shadow:0 10px 30px rgba(34,52,84,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:650px;margin:auto;padding:18px 16px 30px}
.top{display:flex;align-items:center;gap:12px;margin:8px 0 22px}.brand{font-size:29px;font-weight:800;letter-spacing:-.9px}.sub{font-size:14px;color:var(--muted);margin-top:3px}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:750;color:var(--blue);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:13px}.project{cursor:pointer}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:800}.small{font-size:13px;color:var(--muted);line-height:1.45}
.section{font-size:12px;font-weight:800;letter-spacing:.8px;color:#758096;margin:22px 5px 10px}.counts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip,.pill{font-size:12px;font-weight:800;border-radius:999px;padding:7px 10px;background:#eef2f8}.red{color:#c52e37;background:#fff0f1}.orange{color:#b95d00;background:#fff2e2}.blue{color:#1762d4;background:#eaf3ff}.green{color:#087e42;background:#e7f8ef}
.btn{border:0;border-radius:17px;padding:15px 16px;font-weight:800;min-height:52px}.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}.secondary{background:#edf2fa;color:var(--text)}.danger{background:#fff0f1;color:var(--red)}.success{background:#e5f8ed;color:#078341}.orangeBtn{background:#fff0df;color:#bd6200}.blueBtn{background:#e8f2ff;color:#1767d8}.block{width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.hero{background:#fff}.hero h1{margin:0;font-size:27px}.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.metric{border-radius:18px;padding:15px}.metric b{display:block;font-size:24px}.metric span{font-size:11px;font-weight:800}.metric.red{background:#fff0f1}.metric.orange{background:#fff2e2}.metric.blue{background:#eaf3ff}.metric.green{background:#e7f8ef}
.item{padding:16px 17px;cursor:pointer}.itemrow{display:flex;gap:13px;align-items:center}.statusIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:0 0 42px}.statusIcon.red{background:#fff0f1}.statusIcon.orange{background:#fff2e2}.statusIcon.blue{background:#eaf3ff}.statusIcon.green{background:#e7f8ef}
.meta{margin-top:5px;font-size:12px;color:var(--muted)}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:800;color:#778298;margin:0 0 6px 4px;letter-spacing:.5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px;color:var(--text);outline:none;font-size:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#f3f6fb;border-radius:18px;padding:15px;margin:8px 0 16px}.toggle input{width:25px;height:25px}
.segment{display:grid;grid-template-columns:1fr 1fr;background:#edf1f7;border-radius:14px;padding:3px;margin-bottom:16px}.segment button{border:0;border-radius:11px;padding:10px;font-weight:800;background:transparent;color:#68758c}.segment button.on{background:var(--blue);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;font-size:10px;font-weight:700;color:#8993a5;padding:6px 2px}.nav button.active{color:var(--blue)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:31px;box-shadow:0 10px 25px rgba(55,102,255,.28);z-index:11}
.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#e9edf5;font-weight:750;font-size:12px}.tabs button.on{background:var(--text);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 10px}.version{text-align:center;color:#a0a8b7;font-size:11px;margin-top:18px}
.statusPanel{border-radius:20px;padding:15px 16px;margin-top:18px}.statusPanel.orange{background:#fff1df}.statusPanel.green{background:#e6f8ee}.statusPanel.blue{background:#e9f3ff}.statusBig{font-size:14px;font-weight:850}.statusSub{font-size:12px;margin-top:4px;opacity:.75}
.actionStack{display:grid;gap:10px;margin-top:12px}.actionBtn{width:100%;border:0;border-radius:18px;padding:17px 14px;font-weight:850;font-size:15px}.actionBtn.blue{background:#e8f2ff;color:#1266dc}.actionBtn.orange{background:#fff0df;color:#bd6200}.actionBtn.green{background:#e4f8ec;color:#078642}.actionBtn.gray{background:#eef2f8;color:#263247}
.materialGroups .card{padding:0;overflow:hidden}.materialRow{display:flex;align-items:center;gap:12px;padding:17px;border-bottom:1px solid var(--line)}.materialRow:last-child{border-bottom:0}.materialRow .count{margin-left:auto;font-weight:800}.materialRow .arrow{color:#a1a9b7}
.historyToggle{border:0;background:none;color:var(--blue);font-weight:750;padding:10px 2px}.timeline{border-left:2px solid #e5e9f1;margin:8px 0 0 8px;padding-left:15px}.event{margin-bottom:12px}
.hidden{display:none!important}
@media print{body{background:#fff;padding:0}.nav,.fab,.no-print,.back{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ddd}.report-title{display:block!important}}.report-title{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

var APP="OP Site Management";
var VERSION="1.2";
var KEY="op-site-management-v1-data";
var state={projects:[]};
var view={screen:"projects",projectId:"",tab:"today",filter:"all",itemId:""};

function q(id){return document.getElementById(id)}
function esc(s){s=String(s==null?"":s);return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "id"+Date.now().toString(36)+Math.random().toString(36).substr(2,7)}
function isoToday(){var d=new Date();var y=d.getFullYear();var m=("0"+(d.getMonth()+1)).slice(-2);var day=("0"+d.getDate()).slice(-2);return y+"-"+m+"-"+day}
function stamp(){return new Date().toISOString()}
function fmt(d){if(!d)return "—";var x=new Date(d+"T12:00:00");return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert("Could not save data on this device.");return false}}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var x=JSON.parse(raw);if(x&&x.projects instanceof Array)state=x}}catch(e){state={projects:[]}}}

function project(){var i;for(i=0;i<state.projects.length;i++){if(state.projects[i].id===view.projectId)return state.projects[i]}return null}
function currentItem(){var p=project(),i;if(!p)return null;for(i=0;i<p.items.length;i++){if(p.items[i].id===view.itemId)return p.items[i]}return null}
function isDone(i){return i.status==="done"}
function daysLate(d){if(!d)return 0;var a=new Date(isoToday()+"T12:00:00");var b=new Date(d+"T12:00:00");return Math.floor((a-b)/86400000)}
function overdueDays(i){if(isDone(i)||!i.reminderAt)return 0;return Math.max(0,daysLate(i.reminderAt))}
function isOverdue(i){return overdueDays(i)>0}
function isReady(i){return !isDone(i)&&i.requiresMaterial&&i.materialStatus==="received"}
function bucket(i){if(isOverdue(i))return "overdue";if(i.requiresMaterial&&i.materialStatus==="ordered")return "follow";return "do"}
function counts(p){var r={open:0,done:0,over:0,follow:0,ready:0},i,x;for(i=0;i<p.items.length;i++){x=p.items[i];if(isDone(x))r.done++;else r.open++;if(isOverdue(x))r.over++;if(!isDone(x)&&x.requiresMaterial&&x.materialStatus==="ordered")r.follow++;if(isReady(x))r.ready++}return r}

function top(title,sub,back){
 return '<div class="top">'+(back?'<button class="back" onclick="App.back()">‹</button>':'')+
 '<div><div class="brand">'+esc(title)+'</div><div class="sub">'+esc(sub||"")+'</div></div></div>'
}
function nav(){
 var tabs=[["today","☀️","Today"],["items","✓","Items"],["issues","⚠️","Issues"],["materials","▦","Materials"],["report","▤","Report"]],h='<div class="nav">',i,t;
 for(i=0;i<tabs.length;i++){t=tabs[i];h+='<button class="'+(view.tab===t[0]?"active":"")+'" onclick="App.tab(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>'}
 return h+"</div>"
}
function itemCard(i){
 var late=overdueDays(i),m=i.requiresMaterial?(i.materialStatus||"requested"):"none",cl="blue",ico="✓",label="";
 if(isDone(i)){cl="green";ico="✓";label="Done"}
 else if(m==="received"){cl="green";ico="🔧";label="Ready to install"}
 else if(m==="ordered"){cl="orange";ico="⏱";label="Ordered "+ageText(i.orderedAt)}
 else if(m==="requested"){cl="orange";ico="📦";label="Material to order"}
 else if(late>0){cl="red";ico="!";label="Overdue"}
 else {cl="blue";ico="✓";label="Open"}
 return '<div class="card item" onclick="App.openItem(\''+i.id+'\')"><div class="itemrow"><div class="statusIcon '+cl+'">'+ico+'</div><div style="min-width:0;flex:1"><div class="title">'+esc(i.title)+'</div><div class="small">'+esc(i.area||"General")+(i.responsible?' · '+esc(i.responsible):'')+'</div><div class="meta">'+label+'</div></div><span style="color:#a2abba">›</span></div></div>'
}
function projectsView(){
 var h='<div class="wrap">'+top(APP,"Simple site control",false)+'<div class="section">PROJECTS</div>',i,p,c;
 if(!state.projects.length)h+='<div class="card empty">No projects yet.<br>Create your first site project.</div>';
 for(i=0;i<state.projects.length;i++){p=state.projects[i];c=counts(p);h+='<div class="card project" onclick="App.openProject(\''+p.id+'\')"><div class="between"><div class="title">'+esc(p.name)+'</div><span>›</span></div><div class="counts">'+
 (c.over?'<span class="chip red">🔴 '+c.over+' urgent</span>':'')+
 (c.follow?'<span class="chip orange">🟠 '+c.follow+' follow-up</span>':'')+
 '<span class="chip blue">🔵 '+c.open+' open</span>'+
 (c.done?'<span class="chip green">✓ '+c.done+' done</span>':'')+'</div></div>'}
 h+='<button class="btn primary block" onclick="App.newProject()">+ New Project</button>'+
 '<div class="actions"><button class="btn secondary" onclick="App.exportBackup()">Backup</button><button class="btn secondary" onclick="App.importClick()">Restore</button></div>'+
 '<input id="restoreFile" class="hidden" type="file" accept="application/json,.json" onchange="App.restoreBackup(this.files[0])">'+
 '<div class="version">'+APP+' v'+VERSION+'</div></div>';
 return h
}
function todayView(){
 var p=project(),c=counts(p),h='<div class="card hero"><h1>Today</h1><div class="small">'+new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+'</div>'+
 '<div class="grid4"><div class="metric red"><b>'+c.over+'</b><span>OVERDUE</span></div><div class="metric orange"><b>'+c.follow+'</b><span>FOLLOW UP</span></div><div class="metric blue"><b>'+countWaiting(p)+'</b><span>WAITING MATERIAL</span></div><div class="metric green"><b>'+c.ready+'</b><span>READY TO INSTALL</span></div></div></div>';
 var arr=[],i;for(i=0;i<p.items.length;i++)if(!isDone(p.items[i]))arr.push(p.items[i]);
 if(arr.length){h+='<div class="section">NEXT TO FOLLOW UP</div>';for(i=0;i<arr.length;i++)h+=itemCard(arr[i])}else h+='<div class="card empty">Everything is under control. ✓</div>';
 return h
}
function countWaiting(p){var n=0,i;for(i=0;i<p.items.length;i++)if(!isDone(p.items[i])&&p.items[i].requiresMaterial&&p.items[i].materialStatus==="ordered")n++;return n}
function countAction(p,a){var n=0,i;for(i=0;i<p.items.length;i++){if(!isDone(p.items[i])&&bucket(p.items[i])===a)n++}return n}
function listView(mode){
 var p=project(),arr=[],i,x,h='';
 if(mode==="materials"){
   var req=0,ord=0,rec=0,ready=0;
   for(i=0;i<p.items.length;i++){x=p.items[i];if(isDone(x)||!x.requiresMaterial)continue;if(x.materialStatus==="requested")req++;if(x.materialStatus==="ordered")ord++;if(x.materialStatus==="received")rec++;if(x.materialStatus==="received")ready++}
   h='<div class="section">MATERIALS</div><div class="materialGroups card">'+
   matRow("📦","Requested",req,"orange")+matRow("🛒","Ordered",ord,"blue")+matRow("🚚","Received",rec,"blue")+matRow("🔧","Ready to install",ready,"green")+'</div>';
   var mats=[];for(i=0;i<p.items.length;i++)if(!isDone(p.items[i])&&p.items[i].requiresMaterial)mats.push(p.items[i]);
   if(mats.length){h+='<div class="section">ITEMS</div>';for(i=0;i<mats.length;i++)h+=itemCard(mats[i])}
   return h;
 }
 for(i=0;i<p.items.length;i++){x=p.items[i];if(mode==="issues"&&x.kind!=="issue")continue;if(view.filter==="open"&&isDone(x))continue;if(view.filter==="done"&&!isDone(x))continue;arr.push(x)}
 h='<div class="tabs"><button class="'+(view.filter==="all"?"on":"")+'" onclick="App.filter(\'all\')">All</button><button class="'+(view.filter==="open"?"on":"")+'" onclick="App.filter(\'open\')">Open</button><button class="'+(view.filter==="done"?"on":"")+'" onclick="App.filter(\'done\')">Done</button></div><div class="section">'+(mode==="issues"?"ISSUES":"ITEMS")+' · '+arr.length+'</div>';
 if(!arr.length)return h+'<div class="card empty">Nothing here.</div>';for(i=0;i<arr.length;i++)h+=itemCard(arr[i]);return h
}
function matRow(icon,label,n,cl){return '<div class="materialRow"><div class="statusIcon '+cl+'">'+icon+'</div><b>'+label+'</b><span class="count">'+n+'</span><span class="arrow">›</span></div>'}
function reportView(){
 var p=project(),c=counts(p),h='<div class="report-title"><h1>'+esc(p.name)+'</h1><p>Project Action Report · '+fmt(isoToday())+'</p></div>';
 h+='<div class="card"><div class="title">Project Action Report</div><div class="small" style="margin-top:5px">'+esc(p.name)+' only</div>'+
 '<div class="grid4"><div class="metric"><b>'+c.open+'</b><span>OPEN</span></div><div class="metric"><b>'+c.done+'</b><span>DONE</span></div><div class="metric"><b>'+c.over+'</b><span>OVERDUE</span></div><div class="metric"><b>'+c.ready+'</b><span>READY</span></div></div>'+
 '<button class="btn primary block no-print" style="margin-top:14px" onclick="window.print()">Print / Save as PDF</button></div>';
 var i;if(p.items.length){h+='<div class="section">ITEMS</div>';for(i=0;i<p.items.length;i++)h+=itemCard(p.items[i])}
 return h
}
function projectShell(){
 var p=project(),body="";
 if(!p){view.screen="projects";return projectsView()}
 if(view.tab==="today")body=todayView();else if(view.tab==="items")body=listView("items");else if(view.tab==="issues")body=listView("issues");else if(view.tab==="materials")body=listView("materials");else body=reportView();
 return '<div class="wrap">'+top(p.name,"OP Site Management",true)+body+'</div><button class="fab" onclick="App.newItem()">+</button>'+nav()
}
function editView(){
 var i=currentItem();if(!i)i={kind:"task",title:"",area:"",responsible:"",requiresMaterial:false,materialStatus:"none",status:"open",history:[]};
 return '<div class="wrap">'+top(i.id?"Edit Item":"New Item",project().name,true)+'<div class="card">'+
 '<div class="segment"><button id="segTask" class="'+((i.kind||"task")==="task"?"on":"")+'" onclick="App.kind(\'task\')">Task</button><button id="segIssue" class="'+(i.kind==="issue"?"on":"")+'" onclick="App.kind(\'issue\')">Issue</button></div><input id="kind" type="hidden" value="'+esc(i.kind||"task")+'">'+
 fieldText("title","WHAT?",i.title,"Install AC Grille")+fieldText("area","WHERE?",i.area,"Corridor")+fieldText("responsible","WHO?",i.responsible,"Nisha")+
 '<div class="toggle"><b>📦 Material needed</b><input id="requiresMaterial" type="checkbox" '+(i.requiresMaterial?"checked":"")+'></div>'+
 '<button class="btn primary block" onclick="App.saveItem()">Save</button></div></div>'
}
function fieldText(id,label,val,ph){return '<div class="field"><label>'+label+'</label><input id="'+id+'" value="'+esc(val||"")+'" placeholder="'+esc(ph||"")+'"></div>'}
function fieldDate(id,label,val){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="date" value="'+esc(val||"")+'"></div>'}
function fieldArea(id,label,val){return '<div class="field"><label>'+label+'</label><textarea id="'+id+'">'+esc(val||"")+'</textarea></div>'}
function fieldSelect(id,label,opts,val){var h='<div class="field"><label>'+label+'</label><select id="'+id+'">',i;for(i=0;i<opts.length;i++)h+='<option value="'+opts[i][0]+'" '+(val===opts[i][0]?"selected":"")+'>'+opts[i][1]+'</option>';return h+'</select></div>'}
function detailView(){
 var i=currentItem();if(!i){view.screen="project";return projectShell()}
 var m=i.requiresMaterial?(i.materialStatus||"requested"):"none",cl="blue",ico="✓",st="OPEN",sub="";
 if(isDone(i)){cl="green";ico="✓";st="DONE"}
 else if(m==="requested"){cl="orange";ico="📦";st="MATERIAL NEEDED";sub="Ready to be ordered"}
 else if(m==="ordered"){cl="orange";ico="📦";st="WAITING MATERIAL";sub="Ordered "+ageText(i.orderedAt)}
 else if(m==="received"){cl="green";ico="🚚";st="MATERIAL RECEIVED";sub="Ready to install"}
 else if(m==="installed"){cl="green";ico="🔧";st="INSTALLED";sub="Ready to close"}
 var h='<div class="wrap">'+top(i.title,project().name,true)+'<div class="card"><div class="between"><div></div><button class="back" onclick="App.editItem()">Edit</button></div>'+
 '<div style="margin-top:4px"><div class="title">⌖ '+esc(i.area||"General")+'</div>'+(i.responsible?'<div class="small" style="margin-top:8px">♙ '+esc(i.responsible)+'</div>':'')+'</div>'+
 '<div class="statusPanel '+cl+'"><div class="statusBig">'+ico+' &nbsp;'+st+'</div>'+(sub?'<div class="statusSub">'+sub+'</div>':'')+'</div><div class="actionStack">';
 if(!isDone(i)&&i.requiresMaterial){
  if(m==="requested")h+='<button class="actionBtn blue" onclick="App.materialStep(\'ordered\')">🛒 &nbsp; MARK AS ORDERED</button>';
  if(m==="ordered")h+='<button class="actionBtn green" onclick="App.materialStep(\'received\')">🚚 &nbsp; MARK AS RECEIVED</button>';
  if(m==="received")h+='<button class="actionBtn green" onclick="App.materialStep(\'installed\')">🔧 &nbsp; MARK AS INSTALLED</button>';
  if(m==="installed")h+='<button class="actionBtn blue" onclick="App.markDone()">✓ &nbsp; MARK AS DONE</button>';
 }
 if(!isDone(i)&&!i.requiresMaterial)h+='<button class="actionBtn blue" onclick="App.markDone()">✓ &nbsp; MARK AS DONE</button>';
 if(!isDone(i))h+='<button class="actionBtn gray" onclick="App.remind()">🔔 &nbsp; REMIND ME IN 5 DAYS</button>';
 if(isDone(i))h+='<button class="actionBtn gray" onclick="App.reopen()">↶ &nbsp; REOPEN</button>';
 h+='</div></div><button class="historyToggle" onclick="App.toggleHistory()">Show history</button><div id="historyBox" class="card hidden"><div class="timeline">';
 var a=i.history||[],j;if(!a.length)h+='<div class="small">No updates yet.</div>';else for(j=a.length-1;j>=0;j--)h+='<div class="event"><b>'+new Date(a[j].at).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+'</b><div class="small">'+esc(a[j].text)+'</div></div>';
 h+='</div></div><button class="btn danger block" onclick="App.deleteItem()">Delete Item</button></div>';return h
}
function ageText(at){if(!at)return "";var d=Math.max(0,Math.floor((new Date()-new Date(at))/86400000));return d===0?"today":d+" day"+(d===1?"":"s")+" ago"}
function render(){
 var app=q("app");if(!app)return;
 if(view.screen==="projects")app.innerHTML=projectsView();
 else if(view.screen==="edit")app.innerHTML=editView();
 else if(view.screen==="detail")app.innerHTML=detailView();
 else app.innerHTML=projectShell()
}
window.App={
 kind:function(k){q("kind").value=k;q("segTask").className=k==="task"?"on":"";q("segIssue").className=k==="issue"?"on":""},
 toggleHistory:function(){var b=q("historyBox");if(b)b.className=b.className.indexOf("hidden")>=0?"card":"card hidden"},
 newProject:function(){var n=prompt("Project name");if(!n||!n.replace(/\s/g,""))return;var p={id:uid(),name:n.replace(/^\s+|\s+$/g,""),createdAt:stamp(),items:[]};state.projects.unshift(p);save();view={screen:"project",projectId:p.id,tab:"today",filter:"all",itemId:""};render()},
 openProject:function(id){view={screen:"project",projectId:id,tab:"today",filter:"all",itemId:""};render()},
 tab:function(t){view.tab=t;view.screen="project";view.filter="all";render()},
 filter:function(f){view.filter=f;render()},
 back:function(){if(view.screen==="edit"||view.screen==="detail"){view.screen="project"}else if(view.screen==="project"){view.screen="projects";view.projectId=""}else view.screen="projects";render()},
 newItem:function(){view.itemId="";view.screen="edit";render()},
 openItem:function(id){view.itemId=id;view.screen="detail";render()},
 editItem:function(){view.screen="edit";render()},
 toggleMaterial:function(){var b=q("materialBox"),c=q("requiresMaterial");if(b&&c)b.className=c.checked?"":"hidden"},
 saveItem:function(){var title=q("title").value.replace(/^\s+|\s+$/g,"");if(!title){alert("Add a title.");return}var old=currentItem(),i=old||{id:uid(),createdAt:stamp(),status:"open",history:[]};if(!(i.history instanceof Array))i.history=[];i.kind=q("kind").value;i.title=title;i.area=q("area").value;i.responsible=q("responsible").value;i.requiresMaterial=q("requiresMaterial").checked;if(i.requiresMaterial&&(!old||!old.requiresMaterial)){i.materialStatus="requested";i.requestedAt=stamp();i.history.push({at:stamp(),text:"Material requested"})}if(!i.requiresMaterial)i.materialStatus="none";i.updatedAt=stamp();if(!old){i.history.unshift({at:stamp(),text:"Item created"});project().items.unshift(i)}else{i.history.push({at:stamp(),text:"Item updated"})}save();view.itemId=i.id;view.screen="detail";render()},
 materialStep:function(step){var i=currentItem();if(!i)return;if(!(i.history instanceof Array))i.history=[];i.materialStatus=step;var labels={ordered:"Material ordered",received:"Material received",installed:"Installed"};i[step+"At"]=stamp();i.history.push({at:stamp(),text:labels[step]||step});save();render()},
 remind:function(){var i=currentItem();if(!i)return;var d=new Date();d.setDate(d.getDate()+5);i.reminderAt=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);if(!(i.history instanceof Array))i.history=[];i.history.push({at:stamp(),text:"Reminder set for 5 days"});save();render()},
 markDone:function(){var i=currentItem();if(!i)return;i.status="done";if(!(i.history instanceof Array))i.history=[];i.history.push({at:stamp(),text:"Marked as done"});save();render()},
 reopen:function(){var i=currentItem();if(!i)return;i.status="open";if(!(i.history instanceof Array))i.history=[];i.history.push({at:stamp(),text:"Reopened"});save();render()},
 addUpdate:function(){var t=prompt("Quick update / note");if(!t)return;var i=currentItem();if(!(i.history instanceof Array))i.history=[];i.history.push({at:stamp(),text:t});save();render()},
 deleteItem:function(){if(!confirm("Delete this item?"))return;var p=project(),i,newArr=[];for(i=0;i<p.items.length;i++)if(p.items[i].id!==view.itemId)newArr.push(p.items[i]);p.items=newArr;save();view.screen="project";view.itemId="";render()},
 exportBackup:function(){var blob=new Blob([JSON.stringify({type:"op-site-management-backup",version:1,createdAt:stamp(),state:state},null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="OP Site Management Backup "+isoToday()+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href)},1000)},
 importClick:function(){q("restoreFile").click()},
 restoreBackup:function(file){if(!file)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||x.type!=="op-site-management-backup"||!x.state||!(x.state.projects instanceof Array))throw new Error();if(!confirm("Restore backup? Current data will be replaced."))return;state=x.state;save();view={screen:"projects",projectId:"",tab:"today",filter:"all",itemId:""};render()}catch(e){alert("Invalid backup file.")}};r.readAsText(file)}
};

load();
render();

window.addEventListener("load",function(){
 if("serviceWorker" in navigator){
   setTimeout(function(){navigator.serviceWorker.register("./sw.js").catch(function(){})},1000);
 }
});
})();
